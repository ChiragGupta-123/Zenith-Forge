# DevCollab Production Edge Nginx Configuration
# Reverse Proxy, SSL/TLS Termination, WebSocket Upgrades & Asset Routing

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

upstream backend_nodes {
    server backend:4000;
    keepalive 32;
}

upstream frontend_nodes {
    server frontend:80;
    keepalive 16;
}

# ----------------------------------------------------------------------
# 1. HTTP Server: ACME Certbot challenge & HTTPS redirect
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (uncomment when SSL cert is loaded)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Fallback HTTP routing (active prior to SSL setup or when behind AWS ALB / Cloudflare)
    include /etc/nginx/conf.d/proxy-routes.inc;
}

